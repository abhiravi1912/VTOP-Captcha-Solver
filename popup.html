<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VTOP CAPTCHA Solver</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

  :root {
    --portal-blue-dark: #0a4c95;
    --portal-blue-light: #1e74b9;
    --bg-color: #f1f5f9;
    --card-bg: #ffffff;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --accent-color: #1e74b9;
    --primary-glow: rgba(30, 116, 185, 0.18);
    --primary-gradient: linear-gradient(90deg, #0a4c95 0%, #1e74b9 100%);
    --card-border: #e2e8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    width: 320px;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--bg-color);
    padding: 0;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    background: var(--primary-gradient);
    color: #ffffff;
    box-shadow: 0 2px 8px rgba(10, 76, 149, 0.15);
  }

  .header .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    color: #ffffff;
    font-size: 14px;
    backdrop-filter: blur(4px);
  }

  .header h1 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.2px;
    color: #ffffff;
  }

  .content-body {
    padding: 20px;
    background: var(--card-bg);
  }

  label.field-label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .input-wrapper {
    position: relative;
  }

  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13px;
    font-family: monospace;
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease-in-out;
  }

  input:focus {
    border-color: var(--portal-blue-light);
    box-shadow: 0 0 0 3px var(--primary-glow);
  }

  .show-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-secondary);
    cursor: pointer;
    user-select: none;
    transition: color 0.15s;
  }

  .show-toggle:hover {
    color: var(--text-primary);
  }

  .show-toggle input[type="checkbox"] {
    accent-color: var(--accent-color);
    cursor: pointer;
  }

  .btn {
    width: 100%;
    margin-top: 18px;
    padding: 11px;
    background: var(--primary-gradient);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    box-shadow: 0 3px 10px rgba(10, 76, 149, 0.2);
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 14px rgba(10, 76, 149, 0.3);
    background: linear-gradient(90deg, #093f7c 0%, #1a66a4 100%);
  }

  .btn:active {
    transform: translateY(1px);
    box-shadow: 0 2px 6px rgba(10, 76, 149, 0.15);
  }

  .status {
    margin-top: 12px;
    font-size: 11.5px;
    text-align: center;
    min-height: 18px;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo">V</div>
  <h1>VTOP CAPTCHA Solver</h1>
</div>

<div class="content-body">
  <label for="apiKey" class="field-label">API Key</label>
  <div class="input-wrapper">
    <input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off" />
  </div>
  <label class="show-toggle">
    <input type="checkbox" id="showKey" /> Show Key
  </label>

  <button class="btn" id="saveBtn">Save Key</button>
  <div class="status" id="status"></div>
</div>
<script src="popup.js"></script>
</body>
</html>
